services:
  # 1. Frontend Service (React / Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: sttn-frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: always

  # 2. Backend Service (Node.js / Express + SQLite)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sttn-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - ML_SERVICE_URL=http://ml-service:8001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
      # Để DATABASE_URL trống để Backend sử dụng SQLite (sttn.db)
      - DATABASE_URL=
    volumes:
      # Ánh xạ Volume bền vững cho SQLite sttn.db và các file seed
      - ./backend/src/db:/app/src/db
    networks:
      - app-network
    depends_on:
      - ml-service
    restart: always

  # 3. ML Recommendation Service (Python / FastAPI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sttn-ml-service
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:4000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
    volumes:
      # Lưu trữ các file weights và mô hình đã huấn luyện
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
