services:
  postgres:
    image: postgres:16-alpine
    container_name: sttn-postgres
    environment:
      POSTGRES_USER: sttn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sttn_dev_password}
      POSTGRES_DB: sttn
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sttn -d sttn"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-sttn}/sttn-ml-service:latest
    container_name: sttn-ml-service
    environment:
      - BACKEND_URL=http://backend:4000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "8001:8001"
    volumes:
      - ml-models:/app/models   # giữ mô hình đã học từ dữ liệu thật qua các lần restart
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-sttn}/sttn-backend:latest
    container_name: sttn-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - ML_SERVICE_URL=http://ml-service:8001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
      - DATABASE_URL=postgresql://sttn:${POSTGRES_PASSWORD:-sttn_dev_password}@postgres:5432/sttn
      - DATABASE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    image: ${DOCKER_USERNAME:-sttn}/sttn-frontend:latest
    container_name: sttn-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  pg-data:
  ml-models:
