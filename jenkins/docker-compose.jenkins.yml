services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sttn-jenkins-server
    user: root
    privileged: true
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
    name: sttn_jenkins_home
